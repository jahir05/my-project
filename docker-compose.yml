version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdir
      POSTGRES_USER: userdir
      POSTGRES_PASSWORD: userdir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/userdir
      SPRING_DATASOURCE_USERNAME: userdir
      SPRING_DATASOURCE_PASSWORD: userdir
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:schema.sql
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata: